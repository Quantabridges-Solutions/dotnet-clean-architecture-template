name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CleanArchitecture.slnx

      - name: Build
        run: dotnet build CleanArchitecture.slnx --no-restore -c Release

      - name: Test
        run: dotnet test tests/Tests.csproj --no-build -c Release -v normal
